<svg xmlns="http://www.w3.org/2000/svg" width="828" height="99" viewBox="0 0 828 99" role="img" aria-label="plain readme">
  <title>plain readme</title>
  <style>
  text { font-family: ui-monospace, "JetBrains Mono", "SFMono-Regular", Menlo, Consolas, "DejaVu Sans Mono", monospace; }
  .heading { font-size: 11px; letter-spacing: 0.12em; fill: #e6e9ef; }
  .mark { font-size: 11px; fill: #4e24f3; }
  .value { font-size: 23px; letter-spacing: 0.04em; fill: #e6e9ef; }
  .body { font-size: 12px; fill: #9aa3b2; }
  .lit { font-size: 12px; fill: #e6e9ef; }
  .meta { font-size: 11px; letter-spacing: 0.08em; fill: #9aa3b2; }
  .code { font-size: 11.5px; fill: #e6e9ef; }
  .chip { font-size: 11px; letter-spacing: 0.06em; fill: #927cf1; }
  .wordmark { font-size: 40px; letter-spacing: 0.04em; fill: #e6e9ef; }
  .tagline { font-size: 14px; fill: #9aa3b2; }
  .on-accent { fill: #0b0e14; }
  </style>
  <defs>
    <linearGradient id="accent-fill" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#4e24f3"/><stop offset="1" stop-color="#7b5cf6"/></linearGradient>
  </defs>
  <rect x="0" y="0" width="828" height="99" rx="10" fill="#151b26" stroke="rgba(255,255,255,0.07)" stroke-width="1"/>
  <text x="24" y="35" class="mark">◆</text>
  <text x="42" y="35" class="heading">PLAIN README</text>
  <text x="24" y="69" class="body">The same README, with every generated visual represented as text.</text>
</svg>
