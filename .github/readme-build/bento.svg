<svg xmlns="http://www.w3.org/2000/svg" width="888" height="258" viewBox="0 0 888 258" role="img" aria-label="phlepbtw">
  <title>phlepbtw</title>
  <style>
  text { font-family: ui-monospace, "JetBrains Mono", "SFMono-Regular", Menlo, Consolas, "DejaVu Sans Mono", monospace; }
